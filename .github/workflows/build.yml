name: UI Build And Push



on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:

jobs:


  pre-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
            node-version: 14

      - name: Install Dependencies
        run: npm install --force

      - name: Application Build Test
        run: npm run build

  build-and-push:

    if: github.ref == 'refs/heads/main'
        
    needs: pre-build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Login To Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Version
        run: docker --version

      - name: Build UI Image
        run: |
          docker build \
          -t 663566123253.dkr.ecr.ap-south-2.amazonaws.com/ui:${{ github.run_number }} \
          .

      - name: Push UI Image
        run: |
          docker push \
          663566123253.dkr.ecr.ap-south-2.amazonaws.com/ui:${{ github.run_number }}


  deploy:

    if: github.ref == 'refs/heads/main'

    needs: build-and-push        

    runs-on: ubuntu-latest

    steps:

      - name: Deploy UI To EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
       
          script: |

            cd ~/devops_ui

            sed -i "s/^UI_TAG=.*/UI_TAG=${{ github.run_number }}/" .env

            echo "===== UPDATED ENV ====="
            cat .env

            aws ecr get-login-password \
            --region ap-south-2 \
            | docker login \
            --username AWS \
            --password-stdin \
            663566123253.dkr.ecr.ap-south-2.amazonaws.com

            docker compose pull ui

            docker compose up -d --force-recreate ui

            docker ps


  notify:

    if: github.ref == 'refs/heads/main' && always()

    needs:
      - pre-build
      - build-and-push
      - deploy

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Send SNS Notification

        run: |

          STATUS="${{ needs.deploy.result }}"
          BUILD_STATUS="${{ needs.pre-build.result }}"
          PUSH_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          if [ "$BUILD_STATUS" != "success" ]; then
            FAILURE_POINT="Pre-Build"
          elif [ "$PUSH_STATUS" != "success" ]; then
            FAILURE_POINT="Build-And-Push"
          elif [ "$DEPLOY_STATUS" != "success" ]; then
            FAILURE_POINT="Deploy"
          else
            FAILURE_POINT="None"
          fi

          if [ "$BUILD_STATUS" = "success" ] && \
            [ "$PUSH_STATUS" = "success" ] && \
            [ "$DEPLOY_STATUS" = "success" ]; then

            OVERALL_STATUS="SUCCESS"

          else

            OVERALL_STATUS="FAILURE"

          fi

          aws sns publish \
          --region ap-south-2 \
          --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
          --subject "UI Deployment ${OVERALL_STATUS}" \
          --message "
          Repository      : devops_ui

          Build Number    : ${{ github.run_number }}

          Overall Status  : ${OVERALL_STATUS}

          Pre-Build       : ${BUILD_STATUS}

          Build-And-Push  : ${PUSH_STATUS}

          Deploy          : ${DEPLOY_STATUS}

          Failure Point   : ${FAILURE_POINT}

          Commit          : ${{ github.sha }}

          Workflow        : ${{ github.workflow }}

          Repository URL  :
          https://github.com/${{ github.repository }}

          Run URL :
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "