name: Dev To Main Pull Request

on:
  push:
    branches:
      - dev

jobs:

  create-pr:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr create \
            --base main \
            --head dev \
            --title "Dev To Main Merge Request" \
            --body "Automated PR generated from dev branch." \
          || echo "PR already exists"