name: Dev To Main Pull Request

on:
  push:
    branches:
      - dev

jobs:

  create-pr:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Create Pull Request

        uses: peter-evans/create-pull-request@v7

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: dev

          base: main

          title: Auto PR - Dev To Main

          body: |
            Automated pull request generated from dev branch.

            Please review and approve before deployment.